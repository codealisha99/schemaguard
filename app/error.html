<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f6f0" />
    <title>Page not found · SchemaGuard</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/tokens.css" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body data-page="error">
    <a class="skip-link" href="#main">Skip to content</a>
    {{header}}
    <main id="main" tabindex="-1" class="error-page">
      <span class="kicker">HTTP 404 / Page not found</span>
      <h1>This path has no contract.</h1>
      <p>
        The page could not be found. Return to the overview or open the
        validation workspace.
      </p>
      <div class="hero-actions">
        <a class="pill" href="/playground">Open playground</a>
        <a class="pill pill-quiet" href="/">Back to overview</a>
      </div>
    </main>
    {{footer}}
  </body>
</html>
